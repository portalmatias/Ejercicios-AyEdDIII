<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas enlazadas - carga de datos</title>
</head>
<body>
    <h1>LISTAS ENLAZADAS</h1>
    <h2>CARGA DE DATOS</h2>

    <form action="">
        <label for="valor">Valor</label>
        <input type="number" name="valor" id="valor">
        <button type="button" onclick="agregar()">Agregar</button>
        <button type="button" onclick="buscar()">Buscar</button>
        <button type="button" onclick="eliminar()">Eliminar</button>
        <button type="button" onclick="mostrar()">Mostrar</button>
    </form>

    <div id="mostrar"></div>
</body>
<style>
    *{
      box-sizing: border-box;
    }

    form {
      width: 380px;
      background-color: #222223;
      padding: 15px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 0 3px 3px rgb(54, 53, 53)
    }

    label {
      display: block;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      font-weight: bold;
      color: white;
    }

    input{
        margin-top: 10px;
        width: 100%;
    }

    input[type=text],button{
      width: 100%;
    }
    
    input,
    button {
      padding: 10px;
      border: none;
      border-radius: 12px;
      outline: none;
      margin-bottom: 18px;
    }

    button {
      background-color: #103bd8;
      color: white;
    }

    h1, h2 {
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      text-align: center;
      margin-bottom: 30px;
    }

    #mostrar {
      display: flex;
      width: max-content;
      gap: 5px;
      margin: auto;
      margin-top: 20px;
    }

    .valores {
      background-color: #222223;
      color: #fefefe;
      width: 60px;
      height: 60px;
      border-radius: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    p {
      background-color: #222223;
      color: #fefefe;
      display: flex;
      width: max-content;
      height: 60px;
      justify-content: center;
      align-items: center;
      padding: 0 10px;
      border-radius: 30px;
    }

</style>
<script>
// Ejercicio 1: Crea un formulario donde te pida que ingreses un valor, además crea los botones:

// Agregar

  function Lista() {
    this.cabecera = null;
  }

  function Nodo(valor) {
    this.valor = valor;
    this.siguiente = null;
  }

Lista.prototype.add = function (valor) {
    if (this.cabecera === null){
      this.cabecera = new Nodo(valor);
    }else{
      //Creo una variable que guarde el enlace al siguiente nodo
      enlace = this.cabecera;
      while (enlace.siguiente != null) {
        enlace = enlace.siguiente;
      }
      enlace.siguiente = new Nodo(valor);
    }
}


// Buscar
Lista.prototype.buscar = function (valor) {
    if (this.cabecera.valor === valor){
        return true;
    }else{
        let referencia = this.cabecera;
        while (referencia.siguiente !=null) {
            if (referencia.siguiente.valor == valor){
                return true;
            }else{
                referencia = referencia.siguiente;
            }
        }
        return false;
    }
}

// Eliminar 
Lista.prototype.eliminar = function (valor) {
    if (this.cabecera.valor == valor) {
        if (this.cabecera.siguiente == null) {
        this.cabecera = null;
        } else {
        this.cabecera = this.cabecera.siguiente;
        }
        return true;
    } else {
        referencia = this.cabecera;
        while (referencia.siguiente != null) {
        if (referencia.siguiente.valor == valor) {
            if (referencia.siguiente.siguiente == null) {
            referencia.siguiente = null;
            } else {
            referencia.siguiente = referencia.siguiente.siguiente;
            }
            return true;
        } else {
            referencia = referencia.siguiente;
        }
        }
        return false;
    }
}

// Mostrar
Lista.prototype.mostrar = function() {
  let elemento_htlm = document.getElementById("mostrar")

  elemento_htlm.innerHTML = ""

  if(this.cabecera) {
    referencia = this.cabecera

    while (referencia.siguiente != null) {
      elemento_htlm.innerHTML += `
      <div class="valores">${referencia.valor}</div>
      <div class="valores">=></div>
      `
      referencia = referencia.siguiente
    }
    elemento_htlm.innerHTML += `
    <div class="valores">${referencia.valor}</div>
    <div class="valores">=></div>
    <div class="valores">null</div>
    `
  } else {
    return false
  }
}

let lista = new Lista();

function agregar() {
    let valor = document.getElementById("valor").value;
    lista.add(valor);
    console.log(lista);

    lista.mostrar()
}

function buscar() {
    let valor = document.getElementById("valor").value;
    let busqueda = lista.buscar(valor);

    if(busqueda == true) {
        document.getElementById("mostrar").innerHTML = `<div class="valores">${valor}</div>`
    } else{
        document.getElementById("mostrar").innerHTML = `<p>El número ${valor} NO existe en la lista enlazada.</p>`
    }
}

function eliminar() {
  let valor = document.getElementById("valor").value;
  let eliminar = lista.eliminar(valor)

  if (eliminar == true) {
    document.getElementById("mostrar").innerHTML = `<p>Valor eliminado: ${valor}</p>`
  } else {
    document.getElementById("mostrar").innerHTML = `El número ${valor} NO existe en la lista enlazada.`
  }
}

function mostrar() {
  lista.mostrar()
}

</script>
</html>
