        this.data = value
        this.right = null
        this.left = null

    //Funcion constructora mejorada

    Tree.prototype.add = function(value) {
        if (value < this.data) {
            if(this.left == null) {
                this.left = new Tree(value)
            } else {
                this.left.add(value)
            }
        } else {
            if(this.right == null) {
                this.right = new Tree(value)
            } else {
                this.right.add(value)
            }
        }
    }


    let tree = new Tree(18)
    tree.add(10)
    tree.add(30)
    tree.add(5)
    tree.add(25)

    console.log(tree);




    //RECORRIDOS

    let contenedor = []

    //Recorrido pre orden

    Tree.prototype.recorrido1 = function() {
        contenedor.push(this.data) 
        if(this.left) {
            this.left.recorrido1()
        }
        if(this.right) {
            this.right.recorrido1()
        }
    }

    tree.recorrido1()
    console.log(contenedor);



    //Recorrido in orden

    Tree.prototype.recorrido2 = function() {
        if(this.left) {
            this.left.recorrido2()
        }
        contenedor.push(this.data)
        if(this.right) {
            this.right.recorrido2()
        }
    }

    tree.recorrido2()
    console.log(contenedor);



    //Recorrido post orden

    Tree.prototype.recorrido3 = function() {
        if(this.left) {
            this.left.recorrido3()
        }
        if(this.right) {
            this.right.recorrido3()
        }

        contenedor.push(this.data)
    }

    tree.recorrido3()
    console.log(contenedor);
